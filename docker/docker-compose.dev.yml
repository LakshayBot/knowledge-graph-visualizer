services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: causalexplorer_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=causalexplorer_dev;Username=postgres;Password=postgres
    ports:
      - "5001:5001"
    volumes:
      - ../src:/app/src:ro
    depends_on:
      - postgres

  ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEBUG: "true"
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
    volumes:
      - ../src/CausalExplorer.AI:/app:ro

volumes:
  postgres_dev_data:
